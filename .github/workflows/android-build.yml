name: Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Install Linux Dependencies (Required for Tauri CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # فك تشفير ملف التوقيع ووضعه في المكان الذي يتوقعه الجرادل
          echo $ANDROID_KEYSTORE_BASE64 | base64 --decode > src-tauri/gen/android/app/final_key.keystore

      - name: Build APK
        run: cargo tauri android build --apk true
        env:
          # إذا كنت تستخدم متغيرات بيئة لكلمات السر، ضعها هنا
          # حالياً أنت وضعتها hardcoded في ملف gradle، وهذا مقبول للسرعة
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
